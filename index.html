<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive real-time weather dashboard using the Open-Meteo REST API.">
  <title>WeatherFlow | Weather Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section class="weather-card">
      <header>
        <p class="eyebrow">THIRANEX • TASK 4</p>
        <h1>WeatherFlow</h1>
        <p class="subtitle">Live weather, simple and fast.</p>
      </header>

      <form id="searchForm" class="search">
        <label for="cityInput" class="sr-only">City name</label>
        <input id="cityInput" type="search" placeholder="Search a city..." autocomplete="off" required>
        <button type="submit">Search</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite">Search for a city to see its weather.</p>

      <section id="weather" class="weather hidden" aria-label="Weather information">
        <div class="location">
          <div>
            <p class="eyebrow">CURRENT WEATHER</p>
            <h2 id="locationName">—</h2>
            <p id="updated">—</p>
          </div>
          <div class="temperature">
            <span id="temperature">—</span><sup>°C</sup>
          </div>
        </div>

        <p id="condition" class="condition">—</p>

        <div class="metrics">
          <article><span>Humidity</span><strong id="humidity">—</strong></article>
          <article><span>Wind</span><strong id="wind">—</strong></article>
          <article><span>Feels like</span><strong id="feels">—</strong></article>
        </div>
      </section>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
